global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pulse-stream
    # the Spark driver runs on the host and serves /metrics on :8000 (src/pulse/metrics.py)
    static_configs:
      - targets: ["host.docker.internal:8000"]

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install ruff
      - run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - run: pip install -e ".[spark,dev]"
      - name: pytest (includes Spark watermark/dedup streaming tests)
        shell: bash
        run: set -o pipefail; pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Surface pytest output as an annotation on failure
        if: failure()
        shell: bash
        run: |
          [ -f pytest.log ] || exit 0
          python - <<'PY'
          lines = open("pytest.log", errors="replace").read().splitlines()
          keep = [l for l in lines if l.startswith(("FAILED", "ERROR", "E ", "ImportError", "ModuleNotFoundError"))]
          body = "\n".join((keep or lines)[-60:])
          print("::error title=pytest::" + body.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dbt]"
      - name: Synthetic raw layer (includes a replayed micro-batch)
        run: python -m pulse.fixtures --out "$GITHUB_WORKSPACE/data_fixture"
      - name: dbt build (models + tests)
        working-directory: dbt
        env:
          PULSE_DATA: ${{ github.workspace }}/data_fixture
          DUCKDB_PATH: ${{ github.workspace }}/ci.duckdb
        run: dbt build --profiles-dir .

  airflow-dag:
    runs-on: ubuntu-latest
    env:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install Airflow with official constraints
        run: |
          pip install "apache-airflow==2.10.5" pytest pytest-github-actions-annotate-failures \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
      - name: DAG integrity test
        shell: bash
        run: set -o pipefail; pytest -q -rfE --tb=short tests/test_dag_integrity.py 2>&1 | tee pytest.log
      - name: Surface pytest output as an annotation on failure
        if: failure()
        shell: bash
        run: |
          [ -f pytest.log ] || exit 0
          python - <<'PY'
          lines = open("pytest.log", errors="replace").read().splitlines()
          keep = [l for l in lines if l.startswith(("FAILED", "ERROR", "E ", "ImportError", "ModuleNotFoundError"))]
          body = "\n".join((keep or lines)[-60:])
          print("::error title=pytest::" + body.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra/gcp
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Streaming clickstream analytics: Kafka -> Spark Structured Streaming -> BigQuery/DuckDB -> dbt -> Power BI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.11",
    "kafka-python>=2.0.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
spark = ["pyspark==4.0.1"]
gcp = ["google-cloud-bigquery[pandas]>=3.25", "dbt-bigquery>=1.9"]
dbt = ["dbt-duckdb>=1.9", "duckdb>=1.1"]
dev = ["pytest>=8", "pytest-github-actions-annotate-failures>=0.2", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
